<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HL2XG6385L"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-HL2XG6385L');
</script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            font-size: 1.25rem;
            opacity: 0.85;
            letter-spacing: 0.5px;
        }

        .fallback {
            margin-top: 2rem;
            display: none;
        }

        .fallback a {
            color: #a78bfa;
            text-decoration: underline;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p class="message">Redirecting, please wait...</p>
        <div class="fallback" id="fallback">
            <p>If you are not redirected automatically, <a id="manualLink" href="#">click here</a></p>
        </div>
    </div>

    <script>
        // Tier-1 countries → affiliate link
        const tierOneCountries = [
    "FR", // France
    "SE", // Sweden
    "AU", // Australia
    "GB", // United Kingdom
    "DE", // Germany
    "AT", // Austria
    "BE", // Belgium
    "CA", // Canada
    "JP", // Japan
    "CH", // Switzerland
    "PL", // Poland
    "US", // United States
    "NL", // Netherlands
    "IT", // Italy
    "KR"  // South Korea
];

        const LINK_TIER_ONE = "https://freecash.pxf.io/c/5414026/1914468/22930";
        const LINK_DEFAULT  = "https://luuna.site/cl/i/qn1117";

        function redirect(url) {
            window.location.replace(url);
        }

        function showFallback(url) {
            const el = document.getElementById("fallback");
            document.getElementById("manualLink").href = url;
            el.style.display = "block";
        }

        // ── Geolocation providers (5 fallbacks) ──────────────────────

        // 1. ipapi.co – 1 000 req/day free
        function tryIpApiCo() {
            return fetch("https://ipapi.co/json/", { signal: AbortSignal.timeout(3000) })
                .then(r => { if (!r.ok) throw 0; return r.json(); })
                .then(d => d.country_code);
        }

        // 2. ip-api.com – 45 req/min free (HTTP only)
        function tryIpApiCom() {
            return fetch("http://ip-api.com/json/?fields=countryCode", { signal: AbortSignal.timeout(3000) })
                .then(r => { if (!r.ok) throw 0; return r.json(); })
                .then(d => d.countryCode);
        }

        // 3. ipwho.is – unlimited free
        function tryIpWhoIs() {
            return fetch("https://ipwho.is/", { signal: AbortSignal.timeout(3000) })
                .then(r => { if (!r.ok) throw 0; return r.json(); })
                .then(d => { if (!d.success) throw 0; return d.country_code; });
        }

        // 4. freeipapi.com – free, no key
        function tryFreeIpApi() {
            return fetch("https://freeipapi.com/api/json/", { signal: AbortSignal.timeout(3000) })
                .then(r => { if (!r.ok) throw 0; return r.json(); })
                .then(d => d.countryCode);
        }

        // 5. Cloudflare /cdn-cgi/trace – works on any Cloudflare-proxied site
        function tryCfTrace() {
            return fetch("https://www.cloudflare.com/cdn-cgi/trace", { signal: AbortSignal.timeout(3000) })
                .then(r => { if (!r.ok) throw 0; return r.text(); })
                .then(txt => {
                    const m = txt.match(/loc=([A-Z]{2})/);
                    if (!m) throw 0;
                    return m[1];
                });
        }

        // ── Main logic ──────────────────────────────────────────────

        async function getCountryCode() {
            const providers = [tryIpApiCo, tryIpWhoIs, tryFreeIpApi, tryCfTrace, tryIpApiCom];

            for (const provider of providers) {
                try {
                    const code = await provider();
                    if (code && typeof code === "string" && code.length === 2) {
                        return code.toUpperCase();
                    }
                } catch {
                    // Try next provider
                }
            }

            // Last resort: try ALL remaining providers in parallel
            try {
                const results = await Promise.any(providers.map(fn => {
                    return fn().then(code => {
                        if (code && typeof code === "string" && code.length === 2) return code.toUpperCase();
                        throw 0;
                    });
                }));
                return results;
            } catch {
                return null;
            }
        }

        async function detectAndRedirect() {
            const countryCode = await getCountryCode();

            const url = (countryCode && tierOneCountries.includes(countryCode))
                ? LINK_TIER_ONE
                : LINK_DEFAULT;

            redirect(url);

            // Show manual link after 4 seconds as safety net
            setTimeout(() => showFallback(url), 4000);
        }

        detectAndRedirect();
    </script>
</body>
</html>
